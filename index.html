<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Preity 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3a1f3d;
    --rose:#e8657f;
    --peach:#ffb997;
    --gold:#f2c14e;
    --cream:#fff6ee;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Inter",sans-serif;
    background:
      radial-gradient(1200px 800px at 20% -10%, #5a2d5e 0%, transparent 55%),
      radial-gradient(1000px 900px at 110% 120%, #7a3350 0%, transparent 55%),
      var(--plum);
    color:var(--cream);
    min-height:100%;
    display:grid;
    place-items:center;
    overflow-x:hidden;
    text-align:center;
    padding:32px 20px;
  }
  .card{
    position:relative;
    max-width:640px;
    z-index:2;
  }
  .eyebrow{
    font-size:15px;
    letter-spacing:.02em;
    color:var(--peach);
    opacity:0;
    animation:rise .8s ease .2s forwards;
  }
  h1{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:clamp(48px,12vw,104px);
    line-height:.95;
    margin:14px 0 8px;
    background:linear-gradient(100deg,var(--gold),var(--peach),var(--rose));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:rise 1s ease .45s forwards;
  }
  h1 .name{
    display:block;
    font-style:italic;
    font-weight:500;
  }
  p.msg{
    font-size:clamp(17px,2.4vw,21px);
    line-height:1.65;
    max-width:46ch;
    margin:22px auto 0;
    color:#f6e3d8;
    opacity:0;
    animation:rise 1s ease .8s forwards;
  }
  .heart{
    display:inline-block;
    margin-top:34px;
    font-size:34px;
    cursor:pointer;
    opacity:0;
    animation:rise 1s ease 1.1s forwards;
    transition:transform .2s ease;
    user-select:none;
  }
  .heart:hover{transform:scale(1.2) rotate(-6deg)}
  .hint{
    display:block;
    margin-top:10px;
    font-size:13px;
    color:var(--peach);
    opacity:0;
    animation:fade 1s ease 1.5s forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:.7}}

  /* confetti + floating hearts */
  .bit{
    position:fixed;
    top:-40px;
    z-index:1;
    pointer-events:none;
    will-change:transform;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important}
    .bit{display:none}
  }

  /* video overlay */
  .overlay{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(20,8,22,.92);
    backdrop-filter:blur(6px);
    display:none;
    place-items:center;
    padding:24px;
  }
  .overlay.open{display:grid}
  .video-wrap{
    position:relative;
    width:min(880px,100%);
    animation:rise .5s ease;
  }
  video{
    width:100%;
    border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    background:#000;
    display:block;
  }
  .close{
    position:absolute;
    top:-14px;right:-14px;
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:var(--rose);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  .close:hover{background:var(--gold);color:var(--plum)}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Hii Preety</div>
    <h1>Happy Birthday,<span class="name">Preity Kumari</span></h1>
    <p class="msg">Happy birthday, you ❤️🎂 I honestly feel terrible that I forgot your birthday. I hope you're having a beautiful day, and I wish this year brings you so much happiness, peace, and everything you deserve. ❤️</p>
    <span class="heart" id="heart" title="tap me!">💛</span>
    <span class="hint">tap the heart</span>
  </main>

  <div class="overlay" id="overlay">
    <div class="video-wrap">
      <button class="close" id="close" title="close">×</button>
      <video id="video" controls playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser can't play this video.
      </video>
    </div>
  </div>

<script>
const colors = ['#f2c14e','#ffb997','#e8657f','#fff6ee','#ff8fa3'];
function drop(count, fromCenter){
  for(let i=0;i<count;i++){
    const b=document.createElement('div');
    b.className='bit';
    const heart = Math.random()>.6;
    b.textContent = heart ? ['💛','🌸','✨','💗'][Math.floor(Math.random()*4)] : '';
    const size = heart ? (16+Math.random()*18) : (6+Math.random()*8);
    if(!heart){
      b.style.width=size+'px';
      b.style.height=(size*0.5)+'px';
      b.style.background=colors[Math.floor(Math.random()*colors.length)];
      b.style.borderRadius='2px';
    }else{
      b.style.fontSize=size+'px';
    }
    const startX = fromCenter ? window.innerWidth/2 : Math.random()*window.innerWidth;
    b.style.left=startX+'px';
    document.body.appendChild(b);
    const dx=(Math.random()-.5)*(fromCenter?900:300);
    const dur=3000+Math.random()*2500;
    const rot=(Math.random()-.5)*720;
    b.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${dx}px, ${window.innerHeight+80}px) rotate(${rot}deg)`,opacity:1}
    ],{duration:dur,easing:'cubic-bezier(.3,.6,.6,1)'}).onfinish=()=>b.remove();
  }
}
window.addEventListener('load',()=>drop(60,false));

const overlay=document.getElementById('overlay');
const video=document.getElementById('video');
const closeBtn=document.getElementById('close');

function openVideo(){
  drop(45,true);
  overlay.classList.add('open');
  video.currentTime=0;
  video.play().catch(()=>{}); // if autoplay is blocked, user can press play
}
function closeVideo(){
  overlay.classList.remove('open');
  video.pause();
}
document.getElementById('heart').addEventListener('click',openVideo);
closeBtn.addEventListener('click',closeVideo);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeVideo();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo();});
</script>
</body>
</html>
